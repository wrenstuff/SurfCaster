<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <title>Document</title>
</head>

<body>
    {% include 'login-header.html' %}
    <div class="recover-wrapper">
        <div class="recover-container">

            <h3 class="recover-title">Account recovery</h3>
            <p class="email-p">Enter your email address to recover your account</p>
            <div action="{{ url_for('auth_routes.recover') }}" class=" input-fields">
                <form method="POST">
                    <input class="auth-input" type="text" id="email" name="user-email" placeholder="email" required>
                    <div class="submit-btn">
                    <label>
                        <input type="checkbox" id ="checkbox" class ="checkbox" required >
                    </label>
                    <button>submit</button>
            </div>
            </form>
        </div>

        <!--/form-->
        <div class="links">
            <a class="login-link" href="{{ url_for('auth_routes.login') }}">Login</a>
            <a class="signup-link" href="{{ url_for('auth_routes.signup') }}">Signup</a>
        </div>
    </div>
    </div>

</body>

</html>
