<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <title>Document</title>
</head>

<body>

    {% set page_name = "User Management" %}

    {% include 'header.html' %}

    <div class="content">
        <div class="content-wrapper">
            <div class="mod-user">
                <form action="{{ url_for('admin_routes.update_role') }}" method="POST">
                    <h3 class="form-title">Modify User</h3>
                    <input type="text" name="username" placeholder="Username">
                    <select name="role">
                        <option value="admin">Admin</option>
                        <option value="reviewer">Reviewer</option>
                        <option value="unauth">Unauthenticated</option>
                    </select>
                    <button type="submit">Update Role</button>
                </form>
            </div>


            <div class="user-table">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>
                    </thead>
                
                
                    <tbody>
                        {% for user in users %}

                            {% if session.get('username') in user.username  %}
                            {% else %}

                                <tr>
                                    <td>{{ user.id }}</td>
                                    <td>{{ user.username }}</td>
                                    <td>{{ user.email }}</td>
                                    <td>{{ user.role }}</td>
                                </tr>

                            {% endif %}
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
